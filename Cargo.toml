[workspace]
members = ["tools/qcom/qcom-vp"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-3-Clause-Clear"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
libc = "0.2"
quick-xml = "0.38"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
